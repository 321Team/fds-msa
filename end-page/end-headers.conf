# 엔드페이지 응답 공통 보안 헤더. location마다 include한다(add_header는 상위 블록에서 상속되지 않는다).
# 스크립트·스타일·요청은 같은 host로만 허용한다(인라인 스크립트 없음).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
