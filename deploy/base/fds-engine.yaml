apiVersion: v1
kind: ServiceAccount
metadata:
  name: fds-engine-sa
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fds-engine
  labels:
    app: fds-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fds-engine
  template:
    metadata:
      labels:
        app: fds-engine
    spec:
      serviceAccountName: fds-engine-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: fds-engine
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: fds-engine
          image: fds-engine  # overlay의 images:가 레지스트리@digest로 바꾼다
          ports:
            - containerPort: 8001
            - containerPort: 9090
          # DB 접속정보를 주지 않는다(engine → DB 거부 계약)
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fds-engine
  labels:
    app: fds-engine
spec:
  type: ClusterIP  # 외부 노출 없음
  selector:
    app: fds-engine
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
