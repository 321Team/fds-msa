name: Source validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == '321Team/fds-msa'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # inherited pin from infra-cicd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Static source checks
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.2
          python3 tools/check_source.py
          python3 tools/check_dependency_locks.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Application unit and contract smoke tests
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          for service in transaction-api fds-engine; do
            python3 -m venv "$RUNNER_TEMP/$service-venv"
            wheelhouse="$RUNNER_TEMP/$service-wheels"
            mkdir "$wheelhouse"
            PIP_CONFIG_FILE=/dev/null "$RUNNER_TEMP/$service-venv/bin/python" -I -m pip --isolated --disable-pip-version-check --no-cache-dir download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r "$service/requirements-test.lock" --dest "$wheelhouse"
            PIP_CONFIG_FILE=/dev/null "$RUNNER_TEMP/$service-venv/bin/python" -I -m pip --isolated --disable-pip-version-check --no-cache-dir install --no-index --find-links="$wheelhouse" --only-binary=:all: --require-hashes -r "$service/requirements-test.lock"
            "$RUNNER_TEMP/$service-venv/bin/python" -I -m pip --isolated --disable-pip-version-check check
            (cd "$service" && "$RUNNER_TEMP/$service-venv/bin/python" -m pytest -q)
          done

  candidate-images:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == '321Team/fds-msa'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build and scan candidate images without delivery
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/candidate_image_validation.py "$RUNNER_TEMP/candidate-evidence"
      - name: Independently verify preserved evidence after the driver exits
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate-evidence"
          sha256sum --check SHA256SUMS
          if test -f DB_SHA256SUMS; then sha256sum --check DB_SHA256SUMS; fi
      - name: Preserve raw candidate evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-images-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-evidence/
          if-no-files-found: error
          retention-days: 14
