[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# DATABASE_URL은 여기 하드코딩하지 않는다. env.py에서
# 환경변수 DATABASE_URL을 읽어 사용한다 (Secret을 Git에 남기지 않기 위함).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
