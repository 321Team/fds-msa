# transaction-api / fds-engine 모두 K8s API를 호출하지 않는 순수 애플리케이션이므로
# ServiceAccount Token을 자동 마운트하지 않는다 (불필요한 API 접근 표면 제거).
# 향후 K8s API 조회가 필요해지면 그때 Role/RoleBinding을 최소 권한으로 추가한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transaction-api
  namespace: fds
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fds-engine
  namespace: fds
automountServiceAccountToken: false
