# 엔드페이지 전용 nginx 설정 — 이미지 기본 설정을 쓰지 않고 이 파일 하나로 띄운다.
# restricted-v2 SCC(임의 UID)·readOnlyRootFilesystem에서 돌도록 쓰기 경로는 모두 /tmp(emptyDir)다.
# /end/ 아래 정적 파일과 Downward API 파일(/etc/end-meta)만 내보내고 나머지는 404다.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # 라우터가 edge TLS를 끝내므로 절대 경로 리다이렉트(http://...:8080)를 만들지 않는다.
    absolute_redirect off;

    server {
        listen 8080;
        root /opt/app-root/src;

        location = /end {
            include /opt/app-root/etc/end-headers.conf;
            return 301 /end/;
        }

        location = /end/healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /end/meta/pod {
            include /opt/app-root/etc/end-headers.conf;
            add_header Cache-Control "no-store" always;
            default_type text/plain;
            alias /etc/end-meta/pod;
        }

        location = /end/meta/tx-demo {
            include /opt/app-root/etc/end-headers.conf;
            add_header Cache-Control "no-store" always;
            default_type text/plain;
            alias /etc/end-meta/tx-demo;
        }

        location /end/ {
            include /opt/app-root/etc/end-headers.conf;
            limit_except GET HEAD {
                deny all;
            }
            try_files $uri $uri/index.html =404;
        }

        location / {
            return 404;
        }
    }
}
