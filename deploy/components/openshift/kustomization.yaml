# OpenShift(공용 OCP Lab·ROSA) 공통 차이 — 외부 진입 Route와 OpenShift 플랫폼 경로 허용.
# 고정 UID/GID·pull secret을 넣지 않는다: restricted-v2 SCC가 UID를 배정하고, 레지스트리는 #42 결정을 따른다.
# Route host는 자리표시값이다. 실제 overlay가 클러스터 apps 도메인 아래 host로 바꾼다(두 Route는 같은 host).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - route.yaml
patches:
  # 콘솔 Topology 표시용(화면 전용, 동작·권한 변화 없음): 앱 묶음(part-of)·런타임 아이콘·연결 화살표.
  # part-of 값은 fds-hybrid — lab-db 정리 selector(part-of=fds-lab-db)와 겹치지 않는다. selector·spec은 바꾸지 않는다.
  # connects-to는 실제 호출 방향만 그린다(transaction-api → fds-engine 8001). base Deployment에는 주석이 없다.
  - target:
      kind: Deployment
      name: transaction-api
    patch: |-
      - op: add
        path: /metadata/labels/app.kubernetes.io~1part-of
        value: fds-hybrid
      - op: add
        path: /metadata/labels/app.openshift.io~1runtime
        value: python
      - op: add
        path: /metadata/annotations
        value:
          app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"fds-engine"}]'
  - target:
      kind: Deployment
      name: fds-engine
    patch: |-
      - op: add
        path: /metadata/labels/app.kubernetes.io~1part-of
        value: fds-hybrid
      - op: add
        path: /metadata/labels/app.openshift.io~1runtime
        value: python
  # transaction-api: OpenShift 라우터 → 8000, openshift-dns
  - target:
      kind: NetworkPolicy
      name: transaction-api-allow
    patch: |-
      - op: add
        path: /spec/ingress
        value:
          - from:
              - namespaceSelector:
                  matchLabels:
                    policy-group.network.openshift.io/ingress: ""
            ports:
              - port: 8000
                protocol: TCP
      - op: add
        path: /spec/egress/-
        value:
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshift-dns
              podSelector:
                matchLabels:
                  dns.operator.openshift.io/daemonset-dns: default
          ports:
            - port: 5353
              protocol: UDP
            - port: 5353
              protocol: TCP
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP
  # fds-engine: openshift-dns만 (외부 진입·DB 경로 없음)
  - target:
      kind: NetworkPolicy
      name: fds-engine-allow
    patch: |-
      - op: add
        path: /spec/egress
        value:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: openshift-dns
                podSelector:
                  matchLabels:
                    dns.operator.openshift.io/daemonset-dns: default
            ports:
              - port: 5353
                protocol: UDP
              - port: 5353
                protocol: TCP
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP
