# 이 파일은 예시 템플릿입니다. 실제 Secret은 이 파일을 복사해
# CHANGE_ME를 교체한 뒤 로컬에서만 apply 하고, 절대 Git에 커밋하지 않습니다.
#
# 주의: 기존 fds_app 계정 비밀번호가 bash history에 노출된 이력이 있습니다.
# 이 Secret 적용 전 반드시 비밀번호를 새로 발급하고, 노출된 계정은 폐기합니다.
#
# TLS: db01 연결 시 pg_hba.conf가 hostssl을 요구하므로 DATABASE_URL에
# ?sslmode=require (또는 verify-full) 지정이 필요합니다.
apiVersion: v1
kind: Secret
metadata:
  name: transaction-api-secret
  namespace: fds
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://fds_app:CHANGE_ME@10.1.93.55:5432/fdsdb?sslmode=require"
