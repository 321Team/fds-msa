apiVersion: v1
kind: Service
metadata:
  name: transaction-api
  namespace: fds
  labels:
    app: transaction-api
spec:
  # D18 Option A: NodePort + edge01 nginx reverse proxy
  # 실제 3-Worker 클러스터 확보 시 nodePort는 그대로, edge01 nginx upstream에
  # Worker(.105/.107/.108) 3대 IP를 추가한다.
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: transaction-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: fds-engine
  namespace: fds
  labels:
    app: fds-engine
spec:
  # 내부 전용 — Internal Contract §1: 외부 미노출
  type: ClusterIP
  selector:
    app: fds-engine
  ports:
    - name: http
      port: 8001
      targetPort: 8001
