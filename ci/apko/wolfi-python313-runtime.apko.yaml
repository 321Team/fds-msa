contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - python-3.13
    - tzdata

accounts:
  groups:
    - groupname: fdsapp
      gid: 999
  users:
    - username: fdsapp
      uid: 10001
      gid: 999
  run-as: fdsapp

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

archs:
  - amd64
