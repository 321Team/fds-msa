# #43 → #46 ROSA 전달 계약의 기계 판독용 허용목록. tools/check_delivery_render.py가 읽는다.
# 바꾸면 deploy/DELIVERY-CONTRACT-rosa.md와 tools/tests/test_deploy_rosa_delivery.py를 같은 PR에서 고친다.
version: 1
namespace: fds-app
app:
  overlay: deploy/overlays/rosa-app
  applied_by: ci-cd/fds-deployer
  objects:
    - {apiVersion: apps/v1, kind: Deployment, name: transaction-api}
    - {apiVersion: apps/v1, kind: Deployment, name: fds-engine}
    - {apiVersion: v1, kind: Service, name: transaction-api}
    - {apiVersion: v1, kind: Service, name: fds-engine}
    - {apiVersion: route.openshift.io/v1, kind: Route, name: transaction-api-api}
    - {apiVersion: route.openshift.io/v1, kind: Route, name: transaction-api-readyz}
  service_accounts:
    transaction-api: transaction-api-sa
    fds-engine: fds-engine-sa
  secret_refs:
    transaction-api: [transaction-api-db-credentials]
    fds-engine: []
  onprem_egress_label:
    transaction-api: "true"
  # 두 Route가 써야 하는 승인 host 1개(infra-rosa#5 v3.2 §1 조건 2). ingress domain 확정 뒤
  # infra-rosa#4 Handoff 2 기준 값을 PR로 기록한다. PENDING이면 전달 검사는 FAIL(첫 쓰기 전 STOP).
  route_host:
    approved: PENDING
    source: "infra-rosa#4 Handoff 2 (API/Ingress endpoint)"
prereq:
  overlay: deploy/overlays/rosa-prereq
  applied_by: "#5/#7 bootstrap executor (named admin)"
  objects:
    - {apiVersion: v1, kind: ServiceAccount, name: transaction-api-sa}
    - {apiVersion: v1, kind: ServiceAccount, name: fds-engine-sa}
    - {apiVersion: networking.k8s.io/v1, kind: NetworkPolicy, name: transaction-api-allow}
    - {apiVersion: networking.k8s.io/v1, kind: NetworkPolicy, name: fds-engine-allow}
# base에는 있지만 ROSA 두 렌더 어디에도 넣지 않는 것(플랫폼 fds-platform-default-deny와 중복, infra-rosa#7 6109434697 확정).
excluded_on_rosa:
  - {apiVersion: networking.k8s.io/v1, kind: NetworkPolicy, name: default-deny-all}
# 전달 시 남아 있으면 안 되는 자리표시값 표지.
placeholder_markers: [".invalid", "__"]
