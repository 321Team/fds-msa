# ROSA 플랫폼 사전 자원 중 #43이 내용을 정하는 것 — 앱·엔드페이지 ServiceAccount 3개와 NetworkPolicy 3개.
# 배포 SA가 아니라 #5/#7 bootstrap 실행자(named admin)가 배포 전에 적용하고 receipt를 남긴다(infra-rosa#7 6109434697 확정).
# default-deny-all은 플랫폼 fds-platform-default-deny(infra-rosa#7 00)와 같은 기능이라 ROSA에서는 넣지 않는다(#7 확정).
# Secret transaction-api-db-credentials는 여기에도 없다. 값은 저장소 밖 #43/#12 승인 경로로만 만든다.
# 계약·허용목록: deploy/delivery/rosa.yaml, 설명: deploy/DELIVERY-CONTRACT-rosa.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fds-app
resources:
  - ../../base
components:
  - ../../components/openshift
  - ../../components/end-page
labels:
  - pairs:
      project: fds-hybrid
      team: 321team
    includeSelectors: false
patches:
  # 아래는 배포 SA가 적용하는 앱 렌더(rosa-app) 몫이다. 사전 자원 렌더에서 뺀다.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: transaction-api
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fds-engine
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: transaction-api
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: fds-engine
  - patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: transaction-api-api
  - patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: transaction-api-readyz
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-all
  # 엔드페이지의 Deployment·Service·Route는 앱 렌더(rosa-app) 몫이다.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: end-page
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: end-page
  - patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: end-page
